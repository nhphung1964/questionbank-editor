<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor — CO3005 full export (SMART TEST)</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1c2733; --mut:#5b6b7b; --line:#dde3ea;
  --acc:#2563eb; --accsoft:#e8effd; --ok:#15803d; --oksoft:#e7f6ec;
  --warn:#b45309; --warnsoft:#fdf3e3; --err:#b91c1c; --errsoft:#fdeaea;
  --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14181d; --panel:#1c2229; --ink:#e3e9ef; --mut:#93a3b3; --line:#2c3540;
    --acc:#6ea1ff; --accsoft:#20304a; --ok:#4ade80; --oksoft:#173325;
    --warn:#fbbf24; --warnsoft:#3a2e14; --err:#f87171; --errsoft:#3b1a1a; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:650}
header .sp{flex:1}
button,.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);
  padding:5px 12px;border-radius:7px;cursor:pointer;font-size:13px;text-decoration:none;display:inline-block}
button:hover{border-color:var(--acc);color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.primary:hover{opacity:.9;color:#fff}
.filebtn{padding:6px 13px;border-radius:7px;border:1px solid var(--line);cursor:pointer;
  background:var(--panel);color:var(--ink);font-family:var(--mono);font-size:12.5px}
.filebtn.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
#tokrow{display:flex;gap:6px;align-items:center;flex-basis:100%;margin-top:4px}
#token{flex:1;max-width:420px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;
  background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:12px}
#tokhint{font-size:11.5px;color:var(--mut)}
#wrap{display:flex;height:calc(100vh - 92px)}
#side{width:360px;min-width:280px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel)}
#side .tools{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#search{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;
  background:var(--bg);color:var(--ink);font-size:13px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters label{font-size:12px;color:var(--mut);display:flex;gap:4px;align-items:center}
#qlist{flex:1;overflow-y:auto;font-size:13px}
#qlist details{border-bottom:1px solid var(--line)}
#qlist summary{cursor:pointer;padding:8px 12px;font-weight:650;list-style:none;display:flex;align-items:center;gap:8px;user-select:none}
#qlist summary::-webkit-details-marker{display:none}
#qlist summary .arrow{transition:transform .12s;display:inline-block;color:var(--mut);font-size:11px}
#qlist details[open]>summary .arrow{transform:rotate(90deg)}
#qlist summary:hover{background:var(--accsoft)}
summary.chap{font-size:13.5px}
summary.topic{font-weight:500;font-size:12.5px;padding-left:26px;color:var(--ink)}
.cnt{margin-left:auto;font-size:11px;color:var(--mut);font-weight:400;text-align:right}
.unit{padding:7px 12px 7px 42px;cursor:pointer;border-bottom:1px solid var(--line)}
.unit:hover{background:var(--accsoft)}
.unit.sel{background:var(--accsoft);box-shadow:inset 3px 0 0 var(--acc)}
.unit .t{display:flex;gap:6px;align-items:baseline}
.unit .src{font-family:var(--mono);font-weight:700;font-size:11.5px;max-width:210px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit .kind{font-size:10.5px;padding:1px 6px;border-radius:99px;background:var(--accsoft);color:var(--acc);flex:none}
.unit .kind.stem{background:var(--warnsoft);color:var(--warn)}
.unit .crumb{font-size:10.5px;color:var(--mut)}
.unit .flags{font-size:11px;margin-left:auto;flex:none}
.f-warn{color:var(--warn)} .f-err{color:var(--err);font-weight:700}
.unit .snip{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kcount{font-size:11px;color:var(--mut)}
#main{flex:1;overflow-y:auto;padding:16px 22px 90px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:11.5px;padding:2px 9px;border-radius:6px;background:var(--panel);
  border:1px solid var(--line);color:var(--mut)}
.chip b{color:var(--ink);font-family:var(--mono);font-weight:600;word-break:break-all}
h2{font-size:13px;margin:18px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
h3.rec{font-size:13.5px;margin:22px 0 8px;padding:6px 12px;background:var(--accsoft);
  border-radius:7px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h3.rec:first-child{margin-top:0}
h3.rec .mono{font-family:var(--mono);word-break:break-all}
h3.rec .tag{font-size:10.5px;padding:1px 7px;border-radius:99px;background:var(--panel);
  border:1px solid var(--line);color:var(--mut);font-weight:400}
.qcbox{margin:8px 0;padding:8px 12px;border-radius:8px;font-size:12.5px;display:none}
.qcbox.err{display:block;background:var(--errsoft);color:var(--err)}
.qcbox.warn{display:block;background:var(--warnsoft);color:var(--warn)}
/* tabs */
.tabs{display:flex;gap:4px;margin:14px 0 0;border-bottom:1px solid var(--line)}
.tabs button{border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;background:none;
  padding:7px 16px;font-size:13px;color:var(--mut)}
.tabs button.on{background:var(--panel);border-color:var(--line);color:var(--ink);font-weight:600}
.tabpane{display:none;background:var(--panel);border:1px solid var(--line);border-top:none;
  border-radius:0 0 10px 10px;padding:16px 18px}
.tabpane.on{display:block}
/* read view (dạng đề thi) */
.readview{font-size:15px;line-height:1.65}
.readview p{margin:.45em 0}
.readview pre{background:var(--bg);border:1px solid var(--line);border-radius:7px;
  padding:10px 13px;overflow-x:auto;margin:.6em 0}
.readview pre,.readview code{font-family:var(--mono);font-size:13.5px}
.readview code{background:var(--accsoft);border-radius:4px;padding:0 4px}
.readview pre code{background:none;border:none;padding:0}
.ropt{display:flex;gap:11px;align-items:flex-start;padding:9px 12px;margin:7px 0;
  border:1px solid var(--line);border-radius:9px}
.ropt .badge{flex:none;font-family:var(--mono);font-weight:700;font-size:13px;
  width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:var(--accsoft);color:var(--acc);margin-top:2px}
.ropt.correct{border-color:var(--ok);background:var(--oksoft);box-shadow:inset 0 0 0 1px var(--ok)}
.ropt.correct .badge{background:var(--ok);color:#fff}
.ropt .oktag{margin-left:auto;flex:none;font-size:11.5px;color:var(--ok);font-weight:700;margin-top:5px}
/* edit view */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:900px){.duo{grid-template-columns:1fr}}
textarea.html{width:100%;min-height:150px;resize:vertical;font-family:var(--mono);
  font-size:12.5px;line-height:1.55;padding:10px;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);color:var(--ink);white-space:pre;overflow-wrap:normal;overflow-x:auto}
iframe.pv{width:100%;min-height:150px;border:1px solid var(--line);border-radius:8px;background:#fff}
.ans{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-bottom:10px}
.ans .head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ans .head .L{font-weight:700;font-family:var(--mono)}
.ans.correct{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.ans label.cr{font-size:12px;color:var(--mut);display:flex;gap:5px;align-items:center;cursor:pointer}
.ans label.cr input{accent-color:var(--ok)}
.ans .hint{font-size:11.5px;color:var(--warn);margin-top:4px}
#savebar{position:fixed;bottom:0;left:360px;right:0;background:var(--panel);
  border-top:1px solid var(--line);padding:9px 20px;display:none;gap:12px;align-items:center;z-index:4;flex-wrap:wrap}
#status{font-size:12.5px;color:var(--mut)}
#status.ok{color:var(--ok)} #status.err{color:var(--err)}
.empty{color:var(--mut);padding:30px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>📝 Editor — full export SMART TEST</h1>
  <span class="sp"></span>
  <button class="filebtn on" id="lang-vn" onclick="setLang('vn')">📄 CO3005-TV (full)</button>
  <button class="filebtn" id="lang-en" onclick="setLang('en')">📄 CO3005-TA (full)</button>
  <button onclick="qcScan()">🔍 Quét QC</button>
  <a class="btn" id="dl" href="#" download="CO3005-TV.full.json">⬇ Tải JSON</a>
</header>
<div id="tokrow">
  <input id="token" type="password" placeholder="GitHub PAT (repo QuestionBank — Contents: Read and Write)">
  <button onclick="saveToken()">Lưu token</button>
  <button onclick="clearToken()">Xoá token</button>
  <span id="tokhint">Token chỉ nằm trong localStorage máy bạn, gửi thẳng tới github.com. Trang không chứa dữ liệu đề.
  <a href="https://github.com/settings/personal-access-tokens/new" target="_blank">Tạo PAT</a></span>
</div>
<div id="wrap">
  <aside id="side">
    <div class="tools">
      <input id="search" placeholder="Tìm theo mã, chủ đề, nội dung…" oninput="renderTree()">
      <div class="filters">
        <label><input type="checkbox" id="onlyflag" onchange="renderTree()">Chỉ bản ghi lỗi</label>
        <span class="kcount" id="kcount"></span>
      </div>
    </div>
    <div id="qlist"></div>
  </aside>
  <main id="main"><div class="empty">← chọn một câu hoặc cụm câu ở cây bên trái</div></main>
</div>
<div id="savebar">
  <button class="primary" onclick="saveGitHub()">💾 Commit lên GitHub (<span id="sl-lang"></span>)</button>
  <button onclick="reloadOne()">↺ Hoàn tác (đọc lại từ GitHub)</button>
  <button onclick="downloadCurrent()">⬇ Tải bản đã sửa (.json)</button>
  <span id="status"></span>
</div>
<script>
"use strict";
/* ===== cấu hình: 2 file full export trong QuestionBank ===== */
const REPO = "nhphung1964/QuestionBank";
const BRANCH = "main";
const FILES = {
  vn: {label:"CO3005-TV (full)", path:"smarttest-export/CO3005-TV-159305382819266561.full.json"},
  en: {label:"CO3005-TA (full)", path:"smarttest-export/CO3005-TA-159305174207168513.full.json"},
};
const S = { lang:"vn", data:null, records:[], view:null, origSnap:[], rawTxt:"" };
const $ = id => document.getElementById(id);
const strip = h => (h||"").replace(/<[^>]+>/g," ").replace(/&gt;/g,">").replace(/&lt;/g,"<").replace(/&#160;|&nbsp;/g," ").replace(/\s+/g," ").trim();
const isQ = r => r.questionType===1;
const topicOf = r => (r.subjectDetail && r.subjectDetail.name) || "(không chủ đề)";

/* __PURE_START__ */
/* ===== đơn vị xem: 1 câu (questionType 1) hoặc 1 cụm (stem type 6 + children lồng) ===== */
function buildUnits(records){
  const units = [];
  for(const r of records){
    if(r.questionType===6) units.push({anchor:r.id, records:[r, ...(r.children||[])], cluster:true});
    else units.push({anchor:r.id, records:[r], cluster:false});
  }
  return units;
}
/* ===== cây chương (suy từ mã) → chủ đề (subjectDetail.name) → unit ===== */
function chapterOf(r){
  const m=/^261\.C(\d+)\./.exec(r.code||"");
  if(m) return {key:"C"+m[1], n:+m[1], label:"C"+m[1]};
  if(/^survey/i.test(r.code||"")) return {key:"OPS", n:90, label:"OPS"};
  return {key:"ZZ", n:99, label:"Khác"};
}
function buildTree(records){
  const units = buildUnits(records);
  const unitOfRec = new Map();
  units.forEach((u,i)=>{ for(const r of u.records) unitOfRec.set(r.id,i); });
  const chapters = new Map(); // key → {label,n,topics:Map}
  for(const r of records){
    const ch = chapterOf(r);
    if(!chapters.has(ch.key)) chapters.set(ch.key, {label:ch.label, n:ch.n, topics:new Map()});
    const tmap = chapters.get(ch.key).topics;
    const tn = topicOf(r);
    if(!tmap.has(tn)) tmap.set(tn, {name:tn, units:[], seen:new Set()});
  }
  /* unit vào chủ đề: theo chủ đề của TỪNG bản ghi trong unit (stem + con), dedupe */
  for(const r of records){
    const ch = chapterOf(r); const tn = topicOf(r);
    const ui = unitOfRec.get(r.id);
    const t = chapters.get(ch.key).topics.get(tn);
    if(t && !t.seen.has(ui)){ t.seen.add(ui); t.units.push(units[ui]); }
  }
  const recIdx = new Map(records.map((r,i)=>[r.id,i]));
  const list = [...chapters.values()].sort((a,b)=>a.n-b.n);
  for(const ch of list) for(const t of ch.topics.values())
    t.units.sort((a,b)=>recIdx.get(a.anchor)-recIdx.get(b.anchor));
  return {chapters:list, units};
}
/* __PURE_END__ */

/* ===== token + GitHub API ===== */
const memStore = {};
function stGet(k){ try{ return localStorage.getItem(k); }catch(e){ return memStore[k] ?? null; } }
function stSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ memStore[k]=v; return false; } }
function stDel(k){ try{ localStorage.removeItem(k); }catch(e){} delete memStore[k]; }
function getToken(){ return $("token").value.trim(); }
async function saveToken(){
  const t=getToken();
  if(!t){ setStatus("err","chưa có token để lưu — dán PAT vào ô bên cạnh"); return; }
  const ok=stSet("qb_tok", t);
  setStatus("ok", ok ? "✓ đã lưu token — đang tải dữ liệu…" :
    "⚠ Safari đang chặn localStorage (Block All Cookies?) — token chỉ dùng trong phiên này — đang tải dữ liệu…");
  await setLang(S.lang);
}
function clearToken(){ stDel("qb_tok"); $("token").value=""; setStatus("","đã xoá token"); }
$("token").value = stGet("qb_tok") || "";
function ghHeaders(extra={}){
  const h = {"Accept":"application/vnd.github+json", ...extra};
  const t = getToken(); if(t) h["Authorization"] = "Bearer "+t;
  return h;
}
async function loadRaw(path){
  /* qua Contents API — raw.githubusercontent.com chặn CORS preflight khi có Authorization */
  const url = `https://api.github.com/repos/${REPO}/contents/${path}?ref=${BRANCH}`;
  let r;
  try { r = await fetch(url, {headers: ghHeaders({"Accept":"application/vnd.github.raw"})}); }
  catch(e){ throw new Error("không gọi được api.github.com từ browser — kiểm tra mạng ("+(e.message||"fetch lỗi")+")"); }
  if(!r.ok) throw new Error(`HTTP ${r.status} khi tải ${path}` +
    (r.status===404 ? " — chưa dán token, hoặc token chưa có quyền repo QuestionBank" :
     r.status===401 ? " — token sai hoặc đã hết hạn" :
     r.status===403 ? " — token không đủ quyền Contents:Read (hoặc hết quota API)" : ""));
  return r.text();
}
/* score/a/b/c trong export gốc luôn là float (1.0/0.0) — stringify của JS làm rụng .0;
   restore lại để mỗi lần lưu không tạo diff ồ ạt (đã test byte-identical) */
function restoreFloats(s){
  return s.replace(/("(?:score|a|b|c)":\s*)(-?\d+)(?=[,\n}\]])/g,(m,p,n)=>p+n+".0");
}
function serialize(){ return restoreFloats(JSON.stringify(S.data, null, 1)); }
function b64(str){
  const bytes = new TextEncoder().encode(str);
  let bin = ""; const CH = 0x8000;
  for(let i=0;i<bytes.length;i+=CH) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+CH));
  return btoa(bin);
}

/* ===== QC heuristics ===== */
function qcOne(html){
  const flags = [];
  if(/\\n/.test(html)) flags.push(["err","htmlContent chứa \\n literal (dấu backslash-n, không phải xuống dòng thật)"]);
  const inline = [...html.matchAll(/<code class="tex-inline-code">([\s\S]*?)<\/code>/g)].map(m=>m[1]);
  for(const c of inline){
    const t = c.replace(/&#160;/g," ");
    if(/-&gt;|->/.test(t) || /\|/.test(t) || /;\s*$/.test(t) || / {2,}/.test(t))
      flags.push(["warn",`inline code nghi bị "phẳng": ${t.slice(0,60)}${t.length>60?"…":""}`]);
  }
  const po=(html.match(/<p[ >]/g)||[]).length, pc=(html.match(/<\/p>/g)||[]).length;
  if(po!==pc) flags.push(["warn",`số <p> (${po}) ≠ </p> (${pc})`]);
  return flags;
}
function qcRecord(r){
  const f = [...qcOne(r.htmlContent).map(x=>["html",...x])];
  if(isQ(r)){
    const ans = r.answers||[];
    const nc = ans.filter(a=>a.isCorrected).length;
    if(nc!==1) f.push(["answers","err",`số đáp án đúng = ${nc} (phải là 1)`]);
    if(ans.length<4) f.push(["answers","warn",`chỉ ${ans.length} đáp án`]);
    ans.forEach((a,i)=>{
      for(const x of qcOne(a.htmlContent)) f.push([`Đáp ${String.fromCharCode(65+i)}`,...x]);
    });
  }
  return f;
}

/* ===== data ===== */
async function setLang(l){
  S.lang=l;
  $("lang-vn").classList.toggle("on",l==="vn"); $("lang-en").classList.toggle("on",l==="en");
  const f=FILES[l];
  $("dl").download = f.path.split("/").pop();
  $("sl-lang").textContent = f.label;
  setStatus("","đang tải "+f.path.split("/").pop()+" từ GitHub…");
  try{
    S.rawTxt = await loadRaw(f.path);
    S.data = JSON.parse(S.rawTxt);
  }catch(e){
    $("main").innerHTML = `<div class="empty">⚠ ${e.message}</div>
      <div class="empty">Repo private — dán PAT (fine-grained trên repo ${REPO}, quyền Contents: Read) vào ô trên đầu.</div>`;
    setStatus("err", "tải thất bại: "+e.message);
    S.data=null; S.records=[]; S.view=null; renderTree(); return;
  }
  S.records = S.data.questions;
  S.view=null;
  $("main").innerHTML='<div class="empty">← chọn một câu hoặc cụm câu ở cây bên trái</div>';
  $("savebar").style.display="none";
  renderTree();
  const c=S.data.counts||{};
  setStatus("ok",`✓ ${S.data.title} — ${S.records.length} bản ghi top-level`+(c.children?`, ${c.children} câu con`:""));
}
function setStatus(cls,msg){ const st=$("status"); st.className=cls; st.textContent=msg; }

/* ===== cây bên trái ===== */
/* ghi nhớ nhánh đang mở để không bị collapse khi dựng lại cây */
const openState = new Set();
function regKey(el, key){
  el.open = openState.has(key);
  el.addEventListener("toggle", ()=>{ if(el.open) openState.add(key); else openState.delete(key); });
}
function unitFlags(u){ return u.records.flatMap(r=>qcRecord(r).map(f=>[r.code,...f])); }
function renderTree(){
  const box=$("qlist"); box.innerHTML="";
  if(!S.records.length){ $("kcount").textContent=""; return; }
  const st=$("search").value.toLowerCase().trim();
  const onlyF=$("onlyflag").checked;
  const tree=buildTree(S.records);
  const flat = st || onlyF;
  let n=0;
  const mkUnit=(u,crumb)=>{
    n++;
    const flags=unitFlags(u);
    const fe=flags.filter(f=>f[2]==="err").length, fw=flags.length-fe;
    const head=u.records[0];
    const d=document.createElement("div");
    d.className="unit"+(S.view && S.view.records[0].id===head.id?" sel":"");
    d.dataset.uid = String(head.id);
    d.title = head.code || "";
    d.innerHTML=`<div class="t"><span class="src">${head.code||head.id}</span>
      <span class="kind ${head.questionType===6?"stem":""}">${u.cluster?("cụm ×"+u.records.length):"câu"}</span>
      ${crumb?`<span class="crumb">${crumb}</span>`:""}
      ${fe?`<span class="flags f-err">✖${fe}</span>`:""}${fw?`<span class="flags f-warn">⚠${fw}</span>`:""}</div>
      <div class="snip">${strip(head.htmlContent).slice(0,80)||"(trống?)"}</div>`;
    d.onclick=()=>select(u.anchor);
    return d;
  };
  if(flat){
    const lbl=document.createElement("div");
    lbl.style.cssText="padding:8px 12px;font-size:11.5px;color:var(--mut)";
    lbl.textContent=onlyF&&!st?"Đang lọc: chỉ bản ghi có cảnh báo QC":(onlyF?"Tìm kiếm + lọc QC":"Kết quả tìm kiếm");
    box.appendChild(lbl);
    for(const u of tree.units){
      if(onlyF && !unitFlags(u).length) continue;
      if(st){
        const hay=u.records.map(r=>(r.code||"")+" "+topicOf(r)+" "+strip(r.htmlContent)+" "+(r.answers||[]).map(a=>strip(a.htmlContent)).join(" ")).join(" ").toLowerCase();
        if(!hay.includes(st)) continue;
      }
      box.appendChild(mkUnit(u, chapterOf(u.records[0]).label+" · "+topicOf(u.records[0])));
    }
  }else{
    for(const chp of tree.chapters){
      const nrec=chp.topics.size?[...chp.topics.values()].reduce((s,t)=>s+t.units.reduce((x,u)=>x+u.records.length,0),0):0;
      const dc=document.createElement("details");
      regKey(dc, "ch:"+chp.label);
      const sc=document.createElement("summary"); sc.className="chap";
      sc.innerHTML=`<span class="arrow">▶</span> ${chp.label}<span class="cnt">${nrec} bản ghi</span>`;
      dc.appendChild(sc);
      for(const t of chp.topics.values()){
        if(!t.units.length) continue;
        const dt=document.createElement("details");
        regKey(dt, "tp:"+chp.label+"|"+t.name);
        const stt=document.createElement("summary"); stt.className="topic";
        stt.innerHTML=`<span class="arrow">▶</span> ${t.name}<span class="cnt">${t.units.length} unit</span>`;
        dt.appendChild(stt);
        for(const u of t.units) dt.appendChild(mkUnit(u,""));
        dc.appendChild(dt);
      }
      box.appendChild(dc);
    }
  }
  $("kcount").textContent=`${n} unit${flat?" khớp":""} / ${tree.units.length}`;
}

/* chỉ tô sáng dòng được chọn — KHÔNG dựng lại cây (giữ nguyên trạng thái mở) */
function highlightSel(){
  document.querySelectorAll("#qlist .unit.sel").forEach(e=>e.classList.remove("sel"));
  if(S.view){
    const el=document.querySelector(`#qlist .unit[data-uid="${S.view.records[0].id}"]`);
    if(el) el.classList.add("sel");
  }
}
/* ===== view: 1 câu hoặc trọn cụm (stem + children) ===== */
function select(anchorId){
  const units = buildUnits(S.records);
  const unit = units.find(u=>u.anchor===anchorId || u.records.some(r=>r.id===anchorId));
  if(!unit) return;
  S.view = unit;
  S.origSnap = unit.records.map(r=>JSON.stringify(r));
  highlightSel();
  const flags = unitFlags(unit);
  const box = flags.some(f=>f[2]==="err")?"err":(flags.length?"warn":null);
  const qcb = box? `<div class="qcbox ${box}"><b>QC:</b> ${flags.map(f=>`<div>${f[0]} · ${f[3]}</div>`).join("")}</div>` :
    `<div class="qcbox" style="display:block;background:var(--oksoft);color:var(--ok)"><b>QC:</b> không có cảnh báo</div>`;
  const head = r => r.questionType===6
    ? `<h3 class="rec">📄 Phần chung (stem) <span class="mono">${r.code||r.id}</span><span class="tag">${topicOf(r)}</span></h3>`
    : `<h3 class="rec">❓ Câu <span class="mono">${r.code||r.id}</span><span class="tag">${topicOf(r)}</span><span class="tag">${(r.level&&r.level.name)||""}</span><span class="tag">${(r.questionClo&&r.questionClo[0]&&r.questionClo[0].cloCode)||""}</span></h3>`;
  const readSec = (r,i)=>{
    const opts = isQ(r) ? `<h2 style="margin-top:10px">Đáp án</h2><div id="read-ans-${i}"></div>` : "";
    return head(r)+`<div class="readview" id="rq-${i}"></div>`+opts;
  };
  const ansEdit=(r,i)=>{
    if(!isQ(r)) return `<div class="empty" style="padding:6px">stem — không có đáp án</div>`;
    return (r.answers||[]).map((a,j)=>{
      const L=String.fromCharCode(65+j);
      const af=qcOne(a.htmlContent);
      return `<div class="ans ${a.isCorrected?"correct":""}" id="ans-${i}-${j}">
        <div class="head"><span class="L">${L}.</span>
          <label class="cr"><input type="radio" name="cr-${i}" ${a.isCorrected?"checked":""} onchange="markCorrect(${i},${j})">đáp án đúng</label></div>
        <div class="duo"><textarea class="html" id="atx-${i}-${j}" oninput="pv('apv-${i}-${j}',this.value)">${a.htmlContent}</textarea>
        <iframe class="pv" id="apv-${i}-${j}"></iframe></div>
        ${af.length?`<div class="hint">⚠ ${af.map(f=>f[1]).join(" • ")}</div>`:""}</div>`;}).join("");
  };
  const editSec=(r,i)=> head(r)+`
      <div class="duo"><textarea class="html" id="qtx-${i}" oninput="pv('qpv-${i}',this.value)">${r.htmlContent}</textarea>
      <iframe class="pv" id="qpv-${i}"></iframe></div>
      <h2 style="margin-top:12px">Đáp án</h2>${ansEdit(r,i)}`;
  $("main").innerHTML = `
    <div class="meta">
      <span class="chip">mã <b>${unit.records[0].code||unit.records[0].id}</b></span>
      ${unit.cluster?`<span class="chip">cụm <b>${unit.records.length-1} câu</b> + stem</span>`:`<span class="chip">câu đơn</span>`}
      <span class="chip">chủ đề <b>${topicOf(unit.records[0])}</b></span>
      ${unit.cluster?`<span class="chip">các câu <b>${unit.records.slice(1).map(r=>r.code||r.id).join(", ")}</b></span>`:""}
    </div>
    ${qcb}
    <div class="tabs">
      <button id="tab-read" class="on" onclick="showTab('read')">👁 Xem</button>
      <button id="tab-edit" onclick="showTab('edit')">✏️ Sửa</button>
    </div>
    <div class="tabpane on" id="pane-read">${unit.records.map(readSec).join("")}</div>
    <div class="tabpane" id="pane-edit">${unit.records.map(editSec).join("")}</div>`;
  unit.records.forEach((r,i)=>{
    pv("qpv-"+i, $("qtx-"+i).value);
    (r.answers||[]).forEach((a,j)=>pv(`apv-${i}-${j}`, $(`atx-${i}-${j}`).value));
  });
  renderRead();
  $("savebar").style.display="flex";
  setStatus("","");
  $("main").scrollTop=0;
}
function renderRead(){
  if(!S.view || !$("pane-read")) return;
  S.view.records.forEach((r,i)=>{
    const q=$(`rq-${i}`); if(q) q.innerHTML=$("qtx-"+i).value;
    const ra=$(`read-ans-${i}`);
    if(ra) ra.innerHTML = (r.answers||[]).map((a,j)=>{
      const L=String.fromCharCode(65+j);
      return `<div class="ropt ${a.isCorrected?"correct":""}">
        <span class="badge">${L}</span><div class="readview" style="flex:1">${$(`atx-${i}-${j}`).value}</div>
        ${a.isCorrected?`<span class="oktag">✓ đáp án đúng</span>`:""}</div>`;}).join("");
  });
}
function showTab(t){
  $("tab-read").classList.toggle("on",t==="read");
  $("tab-edit").classList.toggle("on",t==="edit");
  $("pane-read").classList.toggle("on",t==="read");
  $("pane-edit").classList.toggle("on",t==="edit");
  if(t==="read") renderRead();
}
function pv(id,html){
  const el=$(id); if(!el) return;
  el.srcdoc=`<!DOCTYPE html><html><head><meta charset="utf-8"><style>
    body{font:14px/1.55 system-ui,sans-serif;margin:10px;color:#1c2733}
    pre{background:#f2f4f7;border:1px solid #e2e7ee;border-radius:6px;padding:9px 11px;overflow-x:auto}
    pre,code{font-family:ui-monospace,Consolas,monospace;font-size:13px}
    code.tex-inline-code{background:#eef1f6;border:1px solid #dde3ea;border-radius:4px;padding:0 4px}
    p{margin:.4em 0}</style></head><body>${html}</body></html>`;
}
function markCorrect(i,j){
  const r=S.view.records[i];
  (r.answers||[]).forEach((a,k)=>{ a.isCorrected = k===j;
    const el=$(`ans-${i}-${k}`); if(el) el.classList.toggle("correct", a.isCorrected);
    const rad=document.querySelectorAll(`input[name=cr-${i}]`)[k];
    if(rad) rad.checked = a.isCorrected; });
  renderRead();
}
/* sửa IN-PLACE (giữ nguyên id/field khác của record & answer); trả về các bản ghi thật sự đổi */
function collectEdits(){
  if(!S.view) return [];
  S.view.records.forEach((r,i)=>{
    r.htmlContent=$("qtx-"+i).value;
    if(isQ(r) && Array.isArray(r.answers))
      r.answers.forEach((a,j)=>{ const el=$(`atx-${i}-${j}`); if(el) a.htmlContent=el.value; });
  });
  return S.view.records.filter((r,i)=>JSON.stringify(r)!==S.origSnap[i]);
}

/* ===== save: commit qua GitHub Contents API ===== */
async function saveGitHub(){
  if(!S.view) return;
  const changed=collectEdits();
  if(!changed.length){ setStatus("","không có thay đổi nào để commit"); return; }
  const t=getToken();
  if(!t){ setStatus("err","chưa có token — dán PAT (Contents: Read and Write) vào ô trên đầu, hoặc dùng 'Tải bản đã sửa' rồi commit tay"); return; }
  setStatus("","đang commit…");
  const path = FILES[S.lang].path;
  const what = changed.slice(0,3).map(r=>r.code||r.id).join(", ") + (changed.length>3?` +${changed.length-3}`:"");
  try{
    const meta = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}?ref=${BRANCH}`, {headers: ghHeaders()})
      .then(x=>{ if(!x.ok) throw new Error("không đọc được sha (HTTP "+x.status+")"); return x.json(); });
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
      method:"PUT", headers: ghHeaders({"Content-Type":"application/json"}),
      body: JSON.stringify({
        message: `editor: sửa ${what} (${FILES[S.lang].label}) — ${new Date().toISOString().slice(0,16)}`,
        content: b64(serialize()), sha: meta.sha, branch: BRANCH })
    });
    if(!res.ok){
      const err = await res.json().catch(()=>({message:res.status}));
      throw new Error("HTTP "+res.status+": "+(err.message||""));
    }
    const j = await res.json();
    S.origSnap = S.view.records.map(r=>JSON.stringify(r));
    setStatus("ok", `✓ đã commit ${changed.length} bản ghi (${what}) — ${j.commit.html_url.replace("https://github.com/","")}`);
    renderTree();
  }catch(e){ setStatus("err", "lưu thất bại: "+e.message); }
}
function downloadCurrent(){
  collectEdits();
  const blob = new Blob([serialize()], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = FILES[S.lang].path.split("/").pop();
  a.click(); URL.revokeObjectURL(a.href);
  setStatus("ok", "✓ đã tải bản JSON trong trình duyệt");
}
async function reloadOne(){ setStatus("","đang đọc lại…"); await setLang(S.lang); }

/* ===== QC scan toàn bộ ===== */
function qcScan(){
  $("search").value=""; $("onlyflag").checked=true; renderTree();
  const flagged=S.records.filter(r=>qcRecord(r).length).length;
  const errs=S.records.filter(r=>qcRecord(r).some(f=>f[1]==="err")).length;
  setStatus("", `Quét xong: lọc "chỉ bản ghi lỗi" — ${flagged}/${S.records.length} bản ghi có cảnh báo, trong đó ${errs} lỗi nặng.`);
}
setLang("vn");
</script>
